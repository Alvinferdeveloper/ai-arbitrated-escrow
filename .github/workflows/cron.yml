# Vercel Hobby only runs crons once a day, but demo auto-release needs minutes.
# Needs repository secrets APP_URL (the deployed origin) and CRON_SECRET.
name: Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        route: [auto-release, retry-audits]
    steps:
      - name: Call /api/cron/${{ matrix.route }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/${{ matrix.route }}"
